spring.config.import=optional:file:.env[.properties]

spring.application.name=couriersyncfeat4

server.port=${SERVER_PORT}
# Configuraci�n de PostgreSQL Data Base
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.pool-name=SupabasePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.show-sql=true

# Flyway migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Configuraci�n de Graphql
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.websocket.path=/graphql-ws

# Configuraci�n del JWT
app.jwt.secret.code=${JWT_SECRET}
app.jwt.access-token-ttl=${ACCESS_TOKEN_TTL}
app.jwt.refresh-token-ttl=${REFRESH_TOKEN_TTL}

# Configuraci�n del Admin
app.admin.email=${ADMIN_EMAIL}

# Configuraci�n del Frontend y Backend
app.frontend.url=${FRONTEND_BASE_URL}
app.backend.url=${BACKEND_BASE_URL}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always