spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=couriersyncfeat4

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.hikari.pool-name=SupabasePool
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.graphql.path=/graphql

# Rate limiting (Bucket4j) distribuido con Redis.
app.rate-limit.enabled=true
app.rate-limit.redis-url=${REDIS_URL:redis://localhost:6379}
app.rate-limit.auth-capacity=10
app.rate-limit.api-capacity=120
app.rate-limit.refill-duration=1m
app.rate-limit.graphql-max-depth=10
app.rate-limit.graphql-max-complexity=100

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.redis.enabled=false