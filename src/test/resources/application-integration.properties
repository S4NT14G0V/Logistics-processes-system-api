spring.application.name=couriersyncfeat4

server.port=0

# Datasource de respaldo: lo sobrescribe @ServiceConnection (Testcontainers).
spring.datasource.url=jdbc:postgresql://localhost:5432/integration
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Paridad con produccion: las migraciones Flyway crean el esquema y validate lo verifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway (corre las migraciones reales V1..V12 contra Postgres).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# GraphQL
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false

# JWT
app.jwt.secret.code=01234567890123456789012345678901
app.jwt.access-token-ttl=900000
app.jwt.refresh-token-ttl=2592000000

# Admin (este email recibe rol ADMIN al registrarse)
app.admin.email=admin@test.com

# Frontend / Backend
app.frontend.url=http://localhost:3001
app.backend.url=http://localhost:8080
