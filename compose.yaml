networks:
  monitoring-net:
    driver: bridge

services:
  backend-app:
    container_name: logistics-processes-system-api
    image: logistics-processes-system-api:1.0.0
    build: .
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      SERVER_PORT: "${SERVER_PORT}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL}"
      BACKEND_BASE_URL: "${BACKEND_BASE_URL}"
      DB_NAME: "${DB_NAME}"
      DB_HOST: "${DB_HOST}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PORT: "${DB_PORT}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION: "${JWT_EXPIRATION}"
      OAUTH2_IDCLIENT: "${OAUTH2_IDCLIENT}"
      OAUTH2_SECRETCLIENT: "${OAUTH2_SECRETCLIENT}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
    networks:
      - monitoring-net

  redis:
    image: redis:7-alpine
    container_name: redis-rate-limit
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  database:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - monitoring-net

volumes:
  postgres_data:
  redis_data:
